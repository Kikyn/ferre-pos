<div class="grid-2">
    <div class="form-group">
        <label>Categoría</label>
        <select id="prod-category" class="form-control" onchange="applyDefaultCategoryMargin()">
            <option value="electrico">Eléctrico (20%)</option>
            <option value="ferreteria">Ferretería (27%)</option>
            <option value="plomeria">Plomería (27%)</option>
            <option value="general">General (20%)</option>
        </select>
    </div>
    <div class="form-group">
        <label>Costo Empresa ($)</label>
        <input type="number" id="prod-cost" class="form-control" placeholder="0.00" step="0.01">
    </div>
    <div class="form-group">
        <label>% Ganancia (Editable)</label>
        <div class="search-row-mobile">
            <input type="number" id="prod-margin-pct" class="form-control" value="20" step="1">
            <button class="btn btn-primary scan-btn" type="button" onclick="calculatePriceFromMargin()">⚡ Calcular %</button>
        </div>
    </div>
    <div class="form-group">
        <label>Precio Público Venta ($)</label>
        <input type="number" id="prod-price" class="form-control" placeholder="0.00" step="0.01">
    </div>
</div>
